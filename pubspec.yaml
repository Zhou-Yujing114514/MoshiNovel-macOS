name: moshi_novel
description: 摩柿小说下载站（MoshiNovel）多平台客户端（Windows / macOS / Linux / Android）
publish_to: 'none'
version: 2.2.1+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.2.0
  cached_network_image: ^3.4.0
  file_selector: ^1.0.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
